name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily (05:00 EAT)
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  backup:
    name: Backup Supabase Postgres
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-17

      - name: Dump database
        env:
          PGHOST: aws-0-eu-west-1.pooler.supabase.com
          PGPORT: 5432
          PGDATABASE: postgres
          PGUSER: postgres.mykyvloynpiqzmqvwekv
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          FILENAME="rena-farm-db-${TIMESTAMP}.sql.gz"
          pg_dump --no-owner --no-acl | gzip > "$FILENAME"
          SIZE=$(du -sh "$FILENAME" | cut -f1)
          echo "BACKUP_FILE=$FILENAME" >> $GITHUB_ENV
          echo "Backup: $FILENAME  ($SIZE)"
          # Fail if dump is suspiciously tiny (< 1 KB = empty/failed dump)
          [ $(wc -c < "$FILENAME") -gt 1024 ] || { echo "ERROR: dump too small — possible connection failure"; exit 1; }

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
