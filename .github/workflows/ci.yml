name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JS syntax
        run: |
          echo "Checking JS syntax..."
          for f in js/*.js; do
            node --check "$f" && echo "  OK: $f" || { echo "SYNTAX ERROR: $f"; exit 1; }
          done

      - name: Validate vercel.json
        run: |
          echo "Validating vercel.json..."
          python3 -m json.tool vercel.json > /dev/null && echo "  OK: vercel.json"

      - name: Check all local image references exist
        run: |
          echo "Checking local image src references..."
          MISSING=()
          for html in *.html; do
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              if [ ! -f "$path" ]; then
                MISSING+=("$html → $path")
              fi
            done < <(grep -oP 'src="\K(?!https?://)[^"]+' "$html" 2>/dev/null || true)
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "Missing local image files:"
            printf '  %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "  OK: all local image references exist"

      - name: Check all internal HTML links resolve
        run: |
          echo "Checking internal href links..."
          MISSING=()
          for html in *.html; do
            while IFS= read -r path; do
              file="${path%%#*}"
              file="${file%%\?*}"
              [ -z "$file" ] && continue
              if [ ! -f "$file" ]; then
                MISSING+=("$html → $file")
              fi
            done < <(grep -oP 'href="\K(?!https?://|mailto:|tel:|#)[^"]+' "$html" 2>/dev/null || true)
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "Broken internal links:"
            printf '  %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "  OK: all internal links resolve"

      - name: Check no .env file committed
        run: |
          if git ls-files | grep -qE '^\.env$'; then
            echo "ERROR: .env file is tracked by git — remove it immediately"
            exit 1
          fi
          echo "  OK: no .env in git"

      - name: Check no service_role key in source
        run: |
          # service_role JWTs are much longer and contain "role":"service_role"
          # Anon keys are intentionally public — only block service_role leaks
          if grep -r "service_role" --include="*.js" --include="*.html" --include="*.json" . 2>/dev/null | grep -v "node_modules" | grep -v ".git"; then
            echo "ERROR: possible service_role key found in source files"
            exit 1
          fi
          echo "  OK: no service_role key in source"
